<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Quest!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="styles/main.css" />
  </head>
  <body>
    <!-- Checked (the default) = the pads spring back to neutral on release,
         like a stick. Unchecked = they hold wherever you let go, which makes
         each one a throttle: set a rate and take your thumb off.
         Keep the default checked - snapping is also what centres the roll pad
         on load. See main.css. -->
    <div id="controls">
      <input type="checkbox" id="self-centring" checked />
      <label for="self-centring">Pads self-centre</label>
    </div>

    <!-- Left joypad: a small scroll container. Scroll within it to move -
         vertically to go forward/back, horizontally to strafe. -->
    <div id="joystick" class="pad">
      <div class="pad-stretcher">
        <!-- Pad-sized and invisible. It's focusable + autofocus, so on load the
             browser scrolls the pad to reveal it; being exactly scrollport-sized,
             the only offset that reveals it in full is dead centre. That gives us
             a deterministic neutral resting position on first paint, no JS.
             Only one element per page can autofocus, so this pad gets it and the
             roll pad relies on scroll-snap alone. -->
        <div class="pad-focus" tabindex="0" autofocus></div>
        <!-- The bit you can actually see. -->
        <div class="pad-marker"></div>
      </div>
    </div>

    <!-- Right joypad: attitude. Horizontal rolls, vertical pitches. -->
    <div id="joystick-attitude" class="pad">
      <div class="pad-stretcher">
        <div class="pad-focus" tabindex="0"></div>
        <div class="pad-marker"></div>
      </div>
    </div>

    <!-- The 3D world we look into. One wrapper per degree of freedom, since an
         element can only carry one transform, nested in the order a view
         transform composes: roll, then pitch, then the translations. -->
    <div id="scene">
      <div id="scene-roll">
        <div id="scene-pitch">
          <div id="scene-z">
            <div id="scene-inner">
              <div id="square"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
