<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Quest!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="styles/main.css" />
  </head>
  <body>
    <!-- Joypad: a small scroll container. Scroll within it to steer. -->
    <div id="joystick">
      <div id="stretcher">
        <!-- Pad-sized and invisible. It's focusable + autofocus, so on load the
             browser scrolls the pad to reveal it; being exactly scrollport-sized,
             the only offset that reveals it in full is dead centre. That gives us
             a deterministic neutral resting position on first paint, no JS. -->
        <div id="joy-focus" tabindex="0" autofocus></div>
        <!-- The bit you can actually see. -->
        <div id="joy-marker"></div>
      </div>
    </div>

    <!-- The 3D world we look into. -->
    <div id="scene">
      <div id="scene-z">
        <div id="scene-inner">
          <div id="square"></div>
        </div>
      </div>
    </div>
  </body>
</html>
