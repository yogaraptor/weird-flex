<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pure CSS 3x3 Grid Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #2c3e50;
        font-family: Arial, sans-serif;
      }

      .viewport {
        width: 600px;
        height: 600px;
        overflow: auto;
        scroll-snap-type: both mandatory;
        border: 4px solid #34495e;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }

      .map {
        display: grid;
        grid-template-columns: repeat(9, 200px);
        grid-template-rows: repeat(9, 200px);
        gap: 0;
      }

      .tile {
        width: 200px;
        height: 200px;
        scroll-snap-align: start;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        font-weight: bold;
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .tile:nth-child(odd) {
        background: #3498db;
      }

      .tile:nth-child(even) {
        background: #2980b9;
      }

      .tile:nth-child(5n) {
        background: #e74c3c;
      }

      .tile:nth-child(7n) {
        background: #27ae60;
      }

      .tile:nth-child(11n) {
        background: #f39c12;
      }
    </style>
  </head>

    <div class="viewport">
      <div class="map">
        <div class="tile">1</div>
        <div class="tile">2</div>
        <div class="tile">3</div>
